<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">

<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#1a1c20; --ink2:#3b3f46; --muted:#7b7f87; --line:#e3ddd1; --line2:#efe9de;
  --bronze:#8a6a3c; --bronze2:#b48d55; --bronze-soft:#f2e9d9; --navy:#1d2943; --ok:#2e6a58; --warn:#a2651a;
  --serif:'Noto Serif KR','Cormorant Garamond',Georgia,serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit}
a{color:inherit}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 24px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{width:34px;height:34px;border-radius:50%;border:1px solid var(--bronze2);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px;stroke:var(--bronze);fill:none;stroke-width:1.6}
.brand h1{font:700 19px/1.2 var(--serif);margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill{font:600 10px/1 var(--sans);letter-spacing:.16em;color:var(--bronze);border:1px solid var(--bronze2);padding:5px 8px;border-radius:999px;margin-left:4px;vertical-align:3px}
.tools{display:flex;gap:10px;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;width:min(340px,38vw)}
.search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.search input{border:0;outline:0;font:500 14px var(--sans);width:100%;background:transparent;color:var(--ink)}
.search:focus-within{border-color:var(--bronze2);box-shadow:0 0 0 3px rgba(180,141,85,.15)}
.lang{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:9px 13px;font:600 12.5px var(--sans);color:var(--muted);cursor:pointer;letter-spacing:.04em}
.lang button.on{background:var(--navy);color:#fff}

/* chips */
.chips{display:flex;gap:8px;padding:10px 24px;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:600 13px var(--sans);color:var(--ink2);cursor:pointer;display:flex;gap:7px;align-items:center;transition:all .15s}
.chip b{font-weight:700;color:var(--bronze)}
.chip:hover{border-color:var(--bronze2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on b{color:#e6cb98}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:calc(100vh - 124px);min-height:520px}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#e9ecee}
.legend{position:absolute;left:14px;bottom:14px;z-index:500;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--ink2);display:flex;gap:14px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .l1{background:var(--bronze);border:2px solid #fff;box-shadow:0 0 0 1px var(--bronze2)}
.legend .l2{background:#fff;border:2px solid var(--bronze)}
.legend .l3{width:18px;height:11px;border-radius:3px;background:rgba(138,106,60,.32);border:1px solid var(--bronze2)}
.panel{overflow-y:auto;background:var(--paper);border-left:1px solid var(--line);padding:24px 26px 44px;min-height:0;scroll-behavior:smooth}

/* map pins */
.pin{width:14px;height:14px;border-radius:50%;background:var(--bronze);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.28);display:grid;place-items:center;color:#fff;font:700 11px/1 var(--sans);transition:transform .15s,background .15s}
.pin.multi{width:24px;height:24px}
.pin.mem{background:#fff;border:2px solid var(--bronze);color:var(--bronze)}
.pin.sel{background:var(--navy);border-color:#fff;color:#fff;transform:scale(1.35);box-shadow:0 0 0 4px rgba(29,41,67,.18),0 2px 8px rgba(0,0,0,.3)}
.leaflet-tooltip.rt{font:600 12.5px var(--sans);color:var(--ink);background:#fffdf8;border:1px solid var(--line);border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.1);padding:6px 10px}
.leaflet-tooltip.rt small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.leaflet-container{font-family:var(--sans)}
.leaflet-interactive:focus,.leaflet-container path:focus,.leaflet-marker-icon:focus{outline:none}
.leaflet-control-attribution{font-size:10px}

/* panel common */
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.crumbs a{color:var(--bronze);cursor:pointer;text-decoration:none;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.back{border:0;background:none;color:var(--bronze);font:600 13px var(--sans);cursor:pointer;padding:0;margin-bottom:14px}
.eyebrow{font:600 11.5px var(--sans);letter-spacing:.14em;color:var(--bronze);text-transform:uppercase}
.ptitle{font:700 26px/1.25 var(--serif);margin:6px 0 6px;letter-spacing:-.01em}
.lead{font-size:14.5px;line-height:1.7;color:var(--ink2);margin:0}
.pmeta{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 6px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font:700 22px/1.1 var(--serif);color:var(--ink)}
.stat span{font-size:11.5px;color:var(--muted)}
.section-t{font:600 11.5px var(--sans);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.section-t::after{content:"";flex:1;height:1px;background:var(--line)}
.rlist{display:grid;gap:4px}
.rgroup{margin-bottom:12px}
.rgroup h4{font:600 14px var(--serif);margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.rgroup h4 span{font:500 12px var(--sans);color:var(--muted)}
.rgroup h4:hover{color:var(--bronze)}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--ink2)}
.rrow:hover{background:var(--bronze-soft);color:var(--ink)}
.rrow em{font-style:normal;font:700 12px var(--sans);color:var(--bronze);background:var(--bronze-soft);border-radius:999px;padding:3px 9px}
.rrow:hover em{background:#fff}
.group{margin-top:20px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px;cursor:pointer}
.ghead h3{font:600 15.5px/1.35 var(--serif);margin:0}
.ghead span{font-size:12px;color:var(--muted);white-space:nowrap}
.ghead:hover h3{color:var(--bronze)}
.row{display:flex;gap:12px;padding:12px 8px;border-radius:12px;cursor:pointer;align-items:flex-start;transition:background .12s}
.row:hover,.row:focus-visible{background:var(--bronze-soft);outline:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--bronze-soft);color:var(--bronze);display:grid;place-items:center;font:700 15px var(--serif);flex:none;border:1px solid #eadcc4}
.row .nm{font:600 15px/1.35 var(--sans);color:var(--ink)}
.row .nm small{font-weight:500;color:var(--muted);margin-left:5px;font-size:12.5px}
.row .ln{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .one{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.5}
.row .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.badge{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--sans);padding:4px 7px;border-radius:6px;white-space:nowrap}
.b-burial{background:var(--bronze);color:#fff}
.b-reburial{background:var(--navy);color:#fff}
.b-memorial{border:1px solid var(--bronze2);color:var(--bronze);background:#fff}
.b-family{background:#ebe8e2;color:#5a5650}
.b-former{border:1px dashed #a39e95;color:#78736b;background:#fff}
.b-ok{background:#e4efea;color:var(--ok)}
.b-check{background:#f7eadb;color:var(--warn)}
.b-related{background:#e6eaf3;color:var(--navy)}

/* person */
.hero{padding-bottom:18px;border-bottom:1px solid var(--line)}
.hero .kn{font:600 12.5px var(--sans);color:var(--bronze);letter-spacing:.02em}
.hero h2{font:700 32px/1.15 var(--serif);margin:8px 0 6px;letter-spacing:-.015em}
.hero .en{font:500 15px var(--sans);color:var(--ink2)}
.hero .tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0 0;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;color:var(--ink)}
.did{margin:0;padding:0;list-style:none}
.did li{position:relative;padding-left:18px;margin:0 0 10px;line-height:1.7;font-size:14.5px;color:var(--ink2)}
.did li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--bronze2)}
.gcard{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;background:#fff}
.gcard .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gcard .cn{font:600 15px/1.35 var(--sans);color:var(--ink)}
.gcard .cn small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.gcard .pl{font-size:12.5px;color:var(--muted);margin-top:6px}
.gcard .nt{font-size:13px;color:var(--ink2);margin-top:9px;line-height:1.6}
.gcard .act{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:600 12.5px var(--sans);cursor:pointer;color:var(--ink2);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--bronze2);color:var(--bronze)}
.note{background:#fbf5ec;border:1px solid #eedfc6;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:#6a5231;margin-top:14px}
.note.blue{background:#f0f3f9;border-color:#dbe2f0;color:#2b3a5c}
.note b{display:block;margin-bottom:3px}
.src a{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--navy);padding:8px 0;border-bottom:1px dashed var(--line);text-decoration:none}
.src a:hover{color:var(--bronze)}
.src a span{color:var(--muted);font-size:12px}
.vlist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.vlist li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.55;color:var(--ink2);cursor:pointer}
.vlist li:hover{border-color:var(--bronze2)}
.vlist li b{color:var(--ink);font-weight:600}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}
.empty{color:var(--muted);font-size:14px;padding:20px 0}

@media (max-width:960px){
  .top{flex-wrap:wrap;padding:12px 16px;gap:10px}
  .brand .sub{white-space:normal}
  .tools{width:100%}
  .search{flex:1;width:auto}
  .chips{padding:9px 16px}
  .layout{grid-template-columns:1fr;height:auto}
  .mapwrap{height:54vh;min-height:340px}
  .panel{border-left:0;border-top:1px solid var(--line);padding:20px 18px 40px;overflow:visible}
  .legend{left:10px;bottom:22px;gap:10px;font-size:11px;padding:7px 10px}
  .legend > span:nth-child(3){display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero h2{font-size:28px}
}

</style>
</head>

</main>

var PEOPLE=[{"id":"underwood","ko":"언더우드","kn":"원두우","en":"Horace Grant Underwood","life":"1859–1916","kr":"1885–1916","mko":"미국 북장로회","men":"Presbyterian Church in the U.S.A.","bko":["1885년 부활절, 아펜젤러와 함께 제물포에 도착한 장로교 첫 목사 선교사.","새문안교회(1887)를 세우고 성경 번역을 이끌었으며, 연희전문학교(현 연세대학교) 설립에 힘썼다."],"ben":["The first ordained Presbyterian missionary in Korea, landing at Chemulpo with Appenzeller on Easter 1885.","Founded Saemoonan Church (1887), led Bible translation and helped found Chosen Christian College, today’s Yonsei University."],"g":[{"c":"yhj","t":"reburial","plot":"F-25","nko":"1916년 미국에서 별세, 1999년 양화진 가족묘역으로 이장. 이 묘역에 4대 7명이 잠들어 있다.","nen":"Died in the U.S. in 1916; reinterred in the family plot at Yanghwajin in 1999, where seven family members across four generations rest."}],"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=39&mode=view"],["Find a Grave","https://www.findagrave.com/memorial/79321781"],["기독신문 2011 (이장)","https://www.kidok.com/news/articleView.html?idxno=70178"]],"st":"ok"},{"id":"appenzeller","ko":"아펜젤러","kn":"아편설라","en":"Henry Gerhard Appenzeller","life":"1858–1902","kr":"1885–1902","mko":"미국 북감리회","men":"Methodist Episcopal Church","bko":["배재학당을 세우고, 정동제일교회의 뿌리가 된 한국 첫 감리교회를 시작했다(1887).","삼문출판사와 성경 번역에 힘쓰다 1902년 군산 앞바다 선박 사고로 순직했다. 시신은 끝내 찾지 못했다."],"ben":["Founded Pai Chai school and began Korea’s first Methodist congregation (1887), today’s Chungdong First Methodist Church.","Ran the Trilingual Press and served on the Bible translation committee; died in a ship collision off Gunsan in 1902. His body was never recovered."],"g":[{"c":"yhj","t":"memorial","plot":"B-37","nko":"배재학당이 세운 추모비. 아들 헨리 닷지와 딸 앨리스가 이곳에 묻혀 있다.","nen":"Memorial raised by Pai Chai school; his son Henry Dodge and daughter Alice are buried here."},{"c":"leidy","t":"memorial","plot":"Section A, Row 6","nko":"2021년 그가 자란 고향 교회 묘지에 세운 기념비.","nen":"Monument dedicated in 2021 at the cemetery of the church where he grew up."}],"chk":{"ko":"양화진 구역 번호가 자료마다 다르다(양화진 공식 B-37 / Find a Grave C-11).","en":"Plot numbers differ between sources (Yanghwajin official B-37 vs Find a Grave C-11)."},"s":[["양화진 QR 안내","http://qr.yanghwajin.net/mandetail/?pid=18&cid=77"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=3&mode=view"],["Eastern PA Conference UMC 2021","https://www.epaumc.org/news/methodists-remember-first-methodist-missionary-to-korea"],["Find a Grave (소더튼)","https://www.findagrave.com/memorial/297840529"]],"st":"check"},{"id":"mary-scranton","ko":"메리 스크랜턴","kn":"스크랜턴 대부인","en":"Mary Fletcher Scranton","life":"1832–1909","kr":"1885–1909","mko":"미국 북감리회 여성해외선교회","men":"Woman’s Foreign Missionary Society, MEC","bko":["52세에 아들 가족과 함께 내한해 1886년 이화학당을 세운 한국 여성 교육의 개척자.","24년 동안 조선 여성을 위해 일하다 1909년 서울에서 별세했다."],"ben":["Came to Korea at 52 with her son’s family and founded Ewha Haktang in 1886, pioneering education for Korean women.","Served Korean women for 24 years and died in Seoul in 1909."],"g":[{"c":"yhj","t":"burial","plot":"B-44"}],"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=36&mode=view"]],"st":"ok"},{"id":"hulbert","ko":"헐버트","kn":"흘법","en":"Homer Bezaleel Hulbert","life":"1863–1949","kr":"1886–1907","mko":"교육 선교사 (미국 북감리회 1893–97)","men":"Educator (Methodist Episcopal mission 1893–97)","bko":["1886년 육영공원 교사로 내한해 순한글 세계지리 교과서 『사민필지』를 펴냈다.","고종을 도와 국권 회복 외교에 나서고 1907년 헤이그 특사를 지원했다. 1949년 광복절 초청으로 왔다가 별세해, \"웨스트민스터 사원보다 한국 땅에 묻히기를 원한다\"는 뜻대로 양화진에 묻혔다."],"ben":["Arrived in 1886 to teach at the Royal English School and wrote Samin Pilji, a world geography in pure Hangul.","Worked for Korean sovereignty as Emperor Gojong’s envoy and supported the 1907 Hague mission. Invited back in 1949, he died soon after arriving and was buried at Yanghwajin, as he wished: “I would rather be buried in Korea than in Westminster Abbey.”"],"g":[{"c":"yhj","t":"burial","plot":"B-07"}],"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=24&mode=view"],["UMC.org","https://www.umc.org/en/content/hulbert-homer-bezaleel-1863-1949"]],"st":"ok"},{"id":"heron","ko":"헤론","kn":"혜론","en":"John W. Heron","life":"1856–1890","kr":"1885–1890","mko":"미국 북장로회 (의료)","men":"Presbyterian Church in the U.S.A. (medical)","bko":["1885년 내한한 의료선교사로, 알렌에 이어 제중원 원장을 맡았다.","1890년 이질로 별세했다. 그를 묻을 곳을 마련하며 양화진 외국인 묘지가 시작되었고, 그가 첫 안장자가 되었다."],"ben":["Medical missionary who arrived in 1885 and succeeded Allen as head of Jejungwon hospital.","Died of dysentery in 1890; the search for a place to bury him led to the founding of Yanghwajin, and he became its first burial."],"g":[{"c":"yhj","t":"burial","plot":"C-21"}],"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=22&mode=view"],["한국민족문화대백과사전","https://encykorea.aks.ac.kr/Article/E0075892"]],"st":"ok"},{"id":"wj-hall","ko":"윌리엄 제임스 홀","kn":"","en":"William James Hall","life":"1860–1894","kr":"1891–1894","mko":"미국 북감리회 (의료) · 캐나다 출신","men":"Methodist Episcopal Church (medical) · Canadian-born","bko":["캐나다 온타리오 출신 의료선교사로 평양 선교를 개척했다.","청일전쟁 때 평양에서 부상자를 돌보다 발진티푸스에 걸려 1894년 별세했다. 아내 로제타 홀과 함께 양화진에 잠들어 있다."],"ben":["Canadian-born medical missionary who opened the Methodist work in Pyongyang.","Caring for the wounded in Pyongyang during the Sino-Japanese War, he contracted typhus and died in 1894. He rests at Yanghwajin beside his wife Rosetta."],"g":[{"c":"yhj","t":"burial"}],"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=20&mode=view"],["Wikipedia","https://en.wikipedia.org/wiki/William_James_Hall"]],"st":"ok"},{"id":"rosetta-hall","ko":"로제타 셔우드 홀","kn":"","en":"Rosetta Sherwood Hall","life":"1865–1951","kr":"1890–1933","mko":"미국 북감리회 여성해외선교회 (의료)","men":"Woman’s Foreign Missionary Society, MEC (medical)","bko":["1890년 내한해 보구여관과 평양에서 여성 환자를 돌보고, 평양 맹아학교(1909)를 세워 점자 교육을 시작했다.","박에스더를 한국 최초의 여성 의사로 길러냈고, 경성여자의학강습소(1928, 고려대 의대의 뿌리)를 세웠다."],"ben":["Arrived in 1890 to treat women at Bogu Yeogwan and in Pyongyang; founded the Pyongyang School for the Deaf and Blind (1909) and introduced braille.","Mentored Esther Park, Korea’s first woman doctor, and co-founded the women’s medical institute of 1928, a forerunner of Korea University’s medical school."],"g":[{"c":"yhj","t":"burial","plot":"C-19","nko":"1951년 미국에서 별세, 남편 곁에 안장.","nen":"Died in the U.S. in 1951 and was buried beside her husband."}],"chk":{"ko":"Find a Grave에 이름·출생연도·사망연도가 같은 다른 로제타 홀(매사추세츠)이 있어, 생일과 사망일로 구별했다.","en":"Find a Grave lists another Rosetta Hall (Massachusetts) with the same birth and death years; told apart by exact dates."},"s":[["Find a Grave","https://www.findagrave.com/memorial/79469350"],["Wikipedia","https://en.wikipedia.org/wiki/Rosetta_Sherwood_Hall"]],"st":"ok"},{"id":"bunker","ko":"벙커","kn":"방거","en":"Dalzell A. Bunker","life":"1853–1932","kr":"1886–","mko":"미국 북감리회 (교육)","men":"Methodist Episcopal Church (education)","bko":["1886년 조선 정부의 근대 학교 육영공원 교사로 내한했고, 뒤에 배재학당장을 지냈다.","1932년 미국에서 별세했지만 \"유골이라도 한국 땅에 묻어 달라\"는 유언에 따라 아내 애니 엘러스 벙커가 양화진에 안장했다."],"ben":["Came in 1886 to teach at Yugyeong Gongwon, the royal government’s modern school, and later led Pai Chai school.","Died in the U.S. in 1932; honoring his wish to rest in Korean soil, his wife Annie Ellers Bunker buried his ashes at Yanghwajin."],"g":[{"c":"yhj","t":"burial","plot":"A-22"}],"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=11&mode=view"]],"st":"ok"},{"id":"kendrick","ko":"루비 켄드릭","kn":"","en":"Ruby Rachel Kendrick","life":"1883–1908","kr":"1907–1908","mko":"미국 남감리회","men":"Methodist Episcopal Church, South","bko":["1907년 미국 남감리회 선교사로 내한해 개성(송도)에서 가르치고 아픈 아이들을 돌봤다.","9개월 만인 1908년 6월 25세로 별세했다. 묘비의 \"내게 천 개의 생명이 있다면 모두 한국에 바치리라\"는 글이 많은 청년을 선교로 이끌었다."],"ben":["Came in 1907 with the Methodist Episcopal Church, South, teaching and nursing children in Songdo (Gaeseong).","Died in June 1908, nine months after arriving, aged 25. Her epitaph, “If I had a thousand lives to give, Korea should have them all,” moved many young people to mission."],"g":[{"c":"yhj","t":"burial","plot":"B-09"}],"chk":{"ko":"묘비에는 1908년 8월 15일 별세로 새겨져 있지만, 당시 선교 잡지 기록으로는 6월 19일로 보인다(양화진 안내).","en":"Her headstone reads 15 Aug 1908, but a mission journal of the time records 19 June (per Yanghwajin)."},"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=26&mode=view"]],"st":"check"},{"id":"moffett","ko":"마펫","kn":"마포삼열","en":"Samuel Austin Moffett","life":"1864–1939","kr":"1890–1936","mko":"미국 북장로회","men":"Presbyterian Church in the U.S.A.","bko":["1890년 내한해 평양 선교를 개척하고 평양장로회신학교(1901)를 세워 한국 장로교 목회자를 길렀다.","신사참배 강요 속에 1936년 한국을 떠났고 1939년 미국에서 별세했다. \"한국에 묻어 달라\"던 유언에 따라 2006년 장로회신학대학교 교정으로 이장되었다."],"ben":["Arrived in 1890, pioneered the Pyongyang mission and founded the Presbyterian Theological Seminary there (1901).","Left Korea in 1936 amid pressure over Shinto shrine worship and died in California in 1939. In 2006 his remains were moved, as he had wished, to the campus of Presbyterian University and Theological Seminary in Seoul."],"g":[{"c":"pcts","t":"reburial","nko":"2006년 이장. 교정 도서관 앞 잔디밭.","nen":"Reinterred in 2006 on the lawn before the seminary library."},{"c":"carpinteria","t":"former","plot":"115, 8","nko":"1939–2006년의 묘소. 지금은 기념 표지만 남아 있다(Find a Grave 기준).","nen":"Grave from 1939 to 2006; now listed as a cenotaph on Find a Grave."}],"s":[["크리스찬투데이 2006 (이장)","http://www.christiantoday.us/8026"],["Find a Grave","https://www.findagrave.com/memorial/29448902"]],"st":"ok"},{"id":"schofield","ko":"스코필드","kn":"석호필","en":"Frank William Schofield","life":"1889–1970","kr":"1916–1920 · 1950년대 말–1970","kren":"1916–1920 · late 1950s–1970","mko":"캐나다 장로회 (세브란스 교수)","men":"Canadian Presbyterian (Severance faculty)","bko":["영국 태생 캐나다 수의학자로 1916년 세브란스의학전문학교 교수로 내한했다.","3·1운동과 제암리 학살을 사진과 글로 세계에 알렸다. 말년에 다시 와 서울대에서 가르치다 1970년 별세, 외국인 최초로 국립서울현충원에 안장되었다."],"ben":["British-born Canadian veterinarian who came in 1916 to teach at Severance Medical College.","Documented the March First Movement and the Jeam-ri massacre for the world. Returning late in life to teach at Seoul National University, he died in 1970 and became the first foreigner buried at Seoul National Cemetery."],"g":[{"c":"snc","t":"burial"}],"s":[["Wikipedia","https://en.wikipedia.org/wiki/Frank_Schofield"]],"st":"ok"},{"id":"bell","ko":"유진 벨","kn":"배유지","en":"Eugene Bell","life":"1868–1925","kr":"1895–1925","mko":"미국 남장로회","men":"Presbyterian Church in the U.S. (Southern)","bko":["1895년 내한해 목포와 광주 선교부를 연 호남 선교의 개척자.","광주 수피아여학교를 세우는 등 교육과 전도에 힘쓰다 1925년 광주에서 별세했다."],"ben":["Arrived in 1895 and opened the Mokpo and Gwangju stations, pioneering mission in the Honam region.","Founded schools including Speer Girls’ School in Gwangju; died in Gwangju in 1925."],"g":[{"c":"yangnim","t":"burial"},{"c":"yhj","t":"family","plot":"A-49","nko":"먼저 세상을 떠난 첫 아내의 묘 (양화진 공식 안내 기준).","nen":"Grave of his first wife, who died before him (per Yanghwajin)."}],"s":[["디지털광주문화대전","http://gwangju.grandculture.net/gwangju/toc/GC60003340"],["Find a Grave","https://www.findagrave.com/memorial/82305315"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=10&mode=view"]],"st":"ok"},{"id":"owen","ko":"오웬","kn":"오기원","en":"Clement Carrington Owen","life":"1867–1909","kr":"1898–1909","mko":"미국 남장로회 (의료)","men":"Presbyterian Church in the U.S. (medical)","bko":["1898년 내한한 의사로 목포와 광주에서 진료하며 전남 곳곳을 순회 전도했다.","1909년 순회 중 얻은 급성폐렴으로 별세해 양림동 선교사 묘역의 첫 안장자가 되었다."],"ben":["Physician who arrived in 1898, treating patients in Mokpo and Gwangju and itinerating across South Jeolla.","Died of acute pneumonia contracted on a preaching trip in 1909, the first burial in the Yangnim-dong missionary cemetery."],"g":[{"c":"yangnim","t":"burial"}],"s":[["디지털광주문화대전","http://gwangju.grandculture.net/gwangju/toc/GC60003340"],["Find a Grave","https://www.findagrave.com/memorial/82304764"]],"st":"ok"},{"id":"shepping","ko":"서서평","kn":"서서평","en":"Elisabeth Johanna Shepping","life":"1880–1934","kr":"1912–1934","mko":"미국 남장로회 (간호)","men":"Presbyterian Church in the U.S. (nursing)","bko":["독일 태생 미국 간호선교사로 1912년 내한해 광주를 중심으로 환자와 고아, 과부를 돌봤다.","이일학교를 세우고 조선간호부회 창립을 이끌었다. 1934년 광주에서 별세했다."],"ben":["German-born American nurse who arrived in 1912 and cared for the sick, orphans and widows around Gwangju.","Founded the Lee Il school for women and led the founding of the Korean nurses’ association. Died in Gwangju in 1934."],"g":[{"c":"yangnim","t":"burial"}],"s":[["디지털광주문화대전","http://gwangju.grandculture.net/gwangju/toc/GC60003340"],["Find a Grave","https://www.findagrave.com/memorial/82309923"]],"st":"ok"},{"id":"junkin","ko":"전킨","kn":"전위렴","en":"William McCleery Junkin","life":"1865–1908","kr":"1892–1908","mko":"미국 남장로회","men":"Presbyterian Church in the U.S. (Southern)","bko":["1892년 미국 남장로회 \"7인의 선발대\" 가운데 한 사람으로 내한해 군산과 전주에서 전도했다.","1908년 전주에서 별세해 예수병원 뒤편 선교사 묘역에 묻혔다."],"ben":["One of the “Seven Pioneers” of the Southern Presbyterian mission (1892), preaching in Gunsan and Jeonju.","Died in Jeonju in 1908 and was buried in the missionary cemetery behind Jesus Hospital."],"g":[{"c":"jeonju","t":"burial"}],"s":[["기사: 전주 선교사 묘역 앞에 서서 (2022)","http://www.hcnews.or.kr/news/11026"],["Find a Grave","https://www.findagrave.com/memorial/249580790"]],"st":"ok"},{"id":"allen","ko":"알렌","kn":"안련","en":"Horace Newton Allen","life":"1858–1932","kr":"1884–1905","mko":"미국 북장로회 (의료) → 주한 미국 공사","men":"Presbyterian Church in the U.S.A. (medical), later U.S. Minister","bko":["1884년 내한한 첫 상주 개신교 선교사(의료). 갑신정변 때 민영익을 살린 일을 계기로 1885년 첫 서양식 병원 광혜원(제중원)을 열었다.","뒤에 주한 미국 공사를 지냈고, 1932년 오하이오주 톨레도에서 별세했다."],"ben":["The first resident Protestant missionary in Korea (1884). After saving Min Yeong-ik during the Gapsin Coup, he opened Gwanghyewon (Jejungwon), Korea’s first Western hospital, in 1885.","Later served as U.S. Minister to Korea; died in Toledo, Ohio, in 1932."],"g":[{"c":"woodlawn","t":"burial","plot":"Section 2, Lot 51"}],"s":[["Find a Grave","https://www.findagrave.com/memorial/62997009"],["Wikipedia","https://en.wikipedia.org/wiki/Horace_Newton_Allen"]],"st":"ok"},{"id":"ohlinger","ko":"올링거","kn":"","en":"Franklin Ohlinger","life":"1845–1919","kr":"1888–1893","mko":"미국 북감리회","men":"Methodist Episcopal Church","bko":["중국 선교를 거쳐 1888년 내한해 배재학당 안 삼문출판사(Trilingual Press)를 운영했다.","1892년 한국 최초의 영문 월간지 『The Korean Repository』를 창간했다. 같은 톨레도 묘지에 알렌도 잠들어 있다."],"ben":["After years in China, arrived in 1888 and ran the Trilingual Press at Pai Chai.","Founded The Korean Repository (1892), the first English-language monthly in Korea. He rests in the same Toledo cemetery as Horace Allen."],"g":[{"c":"woodlawn","t":"burial","plot":"Sec 31, Lot 136"}],"s":[["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=31&mode=view"],["Find a Grave","https://www.findagrave.com/memorial/52847999"]],"st":"ok"},{"id":"jones","ko":"존스","kn":"조원시","en":"George Heber Jones","life":"1867–1919","kr":"1888–1909","mko":"미국 북감리회","men":"Methodist Episcopal Church","bko":["21세 최연소 선교사로 1888년 내한해 인천 내리교회와 제물포 지방을 맡았다.","영한사전을 펴내고 하와이 이민 교인들을 도왔으며, 귀국 뒤에도 감리교 해외선교부에서 한국 선교를 도왔다. 1919년 별세."],"ben":["Arrived in 1888 at 21, the youngest missionary in Korea, and led Naeri Church in Incheon and the Chemulpo district.","Compiled an English–Korean dictionary, supported Korean emigrants to Hawaii and later backed the Korea mission from the Methodist mission board. Died in 1919."],"g":[{"c":"hackensack","t":"burial","plot":"Section J"}],"s":[["Find a Grave","https://www.findagrave.com/memorial/232167102"],["기독교대한감리회 인물사전","https://kmc.or.kr/combination-resources/dictionary?mode=detail&pid=175653"],["Wikipedia","https://en.wikipedia.org/wiki/George_Heber_Jones"]],"st":"ok"},{"id":"hardie","ko":"하디","kn":"하리영","en":"Robert Alexander Hardie","life":"1865–1949","kr":"1890–1935","mko":"미국 남감리회 (캐나다 출신 의료)","men":"Methodist Episcopal Church, South (Canadian-born, medical)","bko":["원산에서 일하던 1903년, 자신의 부족함을 공개 고백하며 원산 부흥을 이끌었다. 이 부흥이 1907년 평양 대부흥의 출발점이 되었다.","협성신학교 교장을 지냈고 1935년 은퇴 후 미국 미시간에서 지내다 1949년 별세했다."],"ben":["His public confession in Wonsan in 1903 sparked a revival that led to the 1907 Pyongyang Great Revival.","Later headed the Methodist theological seminary; retired in 1935 and died in Michigan in 1949."],"g":[{"c":"deepdale","t":"burial"},{"c":"yhj","t":"family","plot":"B-03","nko":"두 딸 마리와 마거릿의 묘. 2006년 기독교대한감리회가 그 위에 \"영적대각성운동 기념비\"를 세웠다.","nen":"Graves of his daughters Marie and Margaret, topped in 2006 by a Korean Methodist memorial to the revival."}],"s":[["Find a Grave (미시간)","https://www.findagrave.com/memorial/154369823"],["Find a Grave (양화진)","https://www.findagrave.com/memorial/79469357"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=21&mode=view"]],"st":"ok"},{"id":"reynolds","ko":"레이놀즈","kn":"이눌서","en":"William Davis Reynolds","life":"1867–1951","kr":"1892–1937","mko":"미국 남장로회","men":"Presbyterian Church in the U.S. (Southern)","bko":["1892년 남장로회 7인의 선발대로 내한해 호남 선교를 열었다.","성경번역위원으로 1911년 한글 성경전서 완역을 이끌었고, 평양장로회신학교에서 가르쳤다."],"ben":["One of the Seven Pioneers of the Southern Presbyterian mission (1892), opening the Honam field.","Led the completion of the Korean Bible (1911) and taught at the Pyongyang seminary."],"g":[{"c":"mtview","t":"burial"},{"c":"yhj","t":"family","plot":"A-46","nko":"어려서 세상을 떠난 첫아들과 둘째 아들 존 볼링 레이놀즈의 묘.","nen":"Graves of his infant first son and of his second son, John Bolling Reynolds."}],"s":[["Find a Grave","https://www.findagrave.com/memorial/183381004"],["평양대부흥(KICH) 선교사 자료","https://www.kich.org/news/articleView.html?idxno=10547"],["고신뉴스 2022","https://www.kosinnews.com/news/articleView.html?idxno=23725"]],"st":"ok"},{"id":"pak-yusan","ko":"박여선","kn":"","en":"Yousan Chairu Pak","life":"1868–1900","kr":"","mko":"선교 동역 한국인 (박에스더의 남편)","men":"Korean co-worker (husband of Dr. Esther Park)","related":true,"bko":["한국 최초의 여성 의사 박에스더의 남편. 1895년 로제타 홀과 함께 미국에 건너가 농장에서 일하며 아내의 의학 공부를 뒷바라지했다.","아내의 졸업을 앞둔 1900년 4월 볼티모어에서 폐결핵으로 별세했다. 2018년 메릴랜드 베다니한인연합감리교회가 이 묘에 부부 기념비를 세웠다."],"ben":["Husband of Esther Park, Korea’s first woman doctor. He went to the U.S. with Rosetta Hall in 1895 and worked on farms to support his wife’s medical studies.","Died of tuberculosis in Baltimore in April 1900, shortly before her graduation. In 2018 Bethany Korean United Methodist Church in Maryland placed a memorial for the couple at his grave."],"g":[{"c":"lorraine","t":"burial","plot":"Section 3","nko":"박에스더의 묘는 아직 찾지 못했다.","nen":"Esther Park’s own grave has not been found."}],"chk":{"ko":"선교사가 아니라 선교 이야기와 이어진 한국인이라, 사전 수록 대상은 아니다. 함께 기억할 인물로 따로 표시했다.","en":"Not a missionary (and not a dictionary entry); shown as a related Korean figure."},"s":[["Find a Grave","https://www.findagrave.com/memorial/85040126"],["당당뉴스 2018","https://www.dangdangnews.com/news/articleView.html?idxno=30066"],["뉴스앤조이 2018","https://www.newsm.com/news/articleView.html?idxno=18829"]],"st":"ok"},{"id":"scharffenberg","ko":"미미 샤펜버그","kn":"","en":"Mimi Theodora Scharffenberg","life":"1883–1919","kr":"1907–1918","mko":"재림교회","men":"Seventh-day Adventist Church","bko":["재림교회가 한국에 보낸 첫 독신 여성 선교사(1907). 순안과 진남포에서 학교를 열고 교재를 번역·편집했다.","병을 얻어 1918년 미국으로 돌아갔고 1919년 12월 별세했다."],"ben":["The first single woman the Seventh-day Adventist Church sent to Korea (1907); opened schools in Sunan and Chinnampo and translated and edited materials.","Fell ill, returned to the U.S. in 1918 and died in December 1919."],"g":[{"c":"rockcreek","t":"burial","plot":"Section V, Lot 008"}],"s":[["재림교 백과사전(ESDA)","https://encyclopedia.adventist.org/article?id=BHBL"],["Find a Grave","https://www.findagrave.com/memorial/138693012"]],"st":"ok"},{"id":"kilbourne","ko":"킬보른","kn":"","en":"Ernest Albert Kilbourne","life":"1865–1928","kr":"1907–1924","mko":"동양선교회(OMS) · 성결교","men":"Oriental Missionary Society (Holiness)","bko":["찰스 카우만과 함께 동양선교회(OMS)를 세운 창립자 가운데 한 사람.","1907년 서울에서 문을 연 복음전도관, 곧 한국 성결교회의 출발을 도왔다."],"ben":["Co-founder of the Oriental Missionary Society (OMS) with Charles Cowman.","Helped launch the Gospel Mission Hall in Seoul in 1907, the beginning of the Korea Evangelical Holiness Church."],"g":[{"c":"forestlawn","t":"burial","plot":"Garden of Ascension"}],"chk":{"ko":"양화진 공식 안내에도 소개되어 있다(D-13). 그 묘가 누구의 것인지 확인이 필요하다.","en":"Also listed by Yanghwajin (plot D-13); whose grave that is needs checking."},"s":[["Find a Grave","https://www.findagrave.com/memorial/137993094"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=27&mode=view"]],"st":"check"},{"id":"graham-lee","ko":"그레이엄 리","kn":"이길함","en":"Graham Lee","life":"1861–1916","kr":"1892–","mko":"미국 북장로회","men":"Presbyterian Church in the U.S.A.","bko":["1892년 내한해 마펫과 함께 평양 선교를 일구었다.","1907년 1월 평양 장대현교회 사경회에서 대부흥을 이끈 선교사 가운데 한 사람이다."],"ben":["Arrived in 1892 and built up the Pyongyang mission with Samuel Moffett.","One of the leaders of the January 1907 Bible conference at Jangdaehyeon Church that sparked the Pyongyang Great Revival."],"g":[{"c":"gavilan","t":"burial","plot":"Section 3, Block 63"}],"chk":{"ko":"Find a Grave 한 곳에서 이름과 생몰일이 일치하는 기록을 찾았다. 두 번째 근거가 필요하다.","en":"One source (Find a Grave) with matching name and dates; a second source is needed."},"s":[["Find a Grave","https://www.findagrave.com/memorial/88909369"]],"st":"check"},{"id":"clark","ko":"클라크","kn":"곽안련","en":"Charles Allen Clark","life":"1878–1961","kr":"1902–1941","mko":"미국 북장로회","men":"Presbyterian Church in the U.S.A.","bko":["1902년 내한해 서울 승동교회를 맡았고, 평양장로회신학교에서 오래 목회학을 가르쳤다.","목회와 교회 정치에 관한 교재를 펴내 한국 장로교 목회의 틀을 세웠다."],"ben":["Arrived in 1902, pastored Seungdong Church in Seoul and taught practical theology at the Pyongyang seminary for decades.","His textbooks on pastoral work and church polity shaped Korean Presbyterian ministry."],"g":[{"c":"muskogee","t":"burial"}],"chk":{"ko":"양화진 공식 안내에 B-22/23 묘가 소개되어 있다. 가족 묘인지 확인이 필요하다.","en":"Yanghwajin lists plots B-22/23 under his name; whether these are family graves needs checking."},"s":[["Find a Grave","https://www.findagrave.com/memorial/89802752"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=15&mode=view"]],"st":"check"},{"id":"pauling","ko":"파울링","kn":"","en":"Edward Clayton Pauling","life":"1864–1960","kr":"1895–1899","mko":"엘라씽 기념선교회 (침례교)","men":"Ella Thing Memorial Mission (Baptist)","bko":["보스턴의 엘라씽 기념선교회 소속으로 1895년 내한했다.","공주와 강경을 중심으로 전도해 한국 침례교회의 첫걸음을 열었다."],"ben":["Came in 1895 with the Ella Thing Memorial Mission of Boston.","Preaching around Gongju and Ganggyeong, he took the first steps of the Baptist church in Korea."],"g":[{"c":"greenlawn","t":"burial"}],"chk":{"ko":"양화진 공식 안내에 A-58 묘가 소개되어 있다. 누구의 묘인지 확인이 필요하다.","en":"Yanghwajin lists plot A-58 under his name; whose grave it is needs checking."},"s":[["Find a Grave","https://www.findagrave.com/memorial/208711233"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=32&mode=view"]],"st":"check"},{"id":"hirst","ko":"허스트","kn":"","en":"Jesse Watson Hirst","life":"1864–1952","kr":"1904–1934","mko":"미국 북장로회 (의료)","men":"Presbyterian Church in the U.S.A. (medical)","bko":["1904년 내한해 에비슨과 함께 세브란스병원에서 진료하고 의학 교육을 맡았다.","1908년 세브란스의 첫 졸업생(의사 7명) 배출에 힘을 보탰다. 1934년 은퇴."],"ben":["Arrived in 1904 to work with Avison at Severance Hospital, treating patients and teaching medicine.","Helped train Severance’s first graduating class of seven doctors in 1908; retired in 1934."],"g":[{"c":"pleasantgrove","t":"burial"},{"c":"yhj","t":"family","plot":"A-42","nko":"아내와 딸 캐롤의 묘. Find a Grave에는 허스트의 기념 표지로도 등록되어 있다.","nen":"Graves of his wife and daughter Carol; Find a Grave also lists a cenotaph for him here."}],"chk":{"ko":"Find a Grave의 두 기록에 적힌 생일이 서로 다르다(3월 30일 / 12월 24일).","en":"His two Find a Grave records give different birthdays (30 Mar vs 24 Dec 1864)."},"s":[["Find a Grave (켄터키)","https://www.findagrave.com/memorial/24946464"],["Find a Grave (양화진)","https://www.findagrave.com/memorial/79469365"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=23&mode=view"]],"st":"check"},{"id":"adams","ko":"애덤스","kn":"안의와","en":"James Edward Adams","life":"1867–1929","kr":"1895–","mko":"미국 북장로회","men":"Presbyterian Church in the U.S.A.","bko":["1895년 내한해 부산을 거쳐 대구 선교부를 맡아 대구제일교회를 조직했다.","계성학교를 세우는 등 대구·경북 선교의 기틀을 놓았다."],"ben":["Arrived in 1895 and, after Busan, took charge of the Daegu station, organizing Daegu First Church.","Founded Keisung School and laid the groundwork for mission in Daegu and North Gyeongsang."],"g":[{"c":"goldengate","t":"burial"}],"chk":{"ko":"Find a Grave 한 곳에서 이름과 생몰일이 일치하는 기록을 찾았다. 두 번째 근거가 필요하다.","en":"One source (Find a Grave) with matching name and dates; a second source is needed."},"s":[["Find a Grave","https://www.findagrave.com/memorial/207260894"],["미국장로교 내한 선교사 총람","https://pcusa.org/sites/default/files/%EB%AF%B8%EA%B5%AD%EC%9E%A5%EB%A1%9C%EA%B5%90-%EB%82%B4%ED%95%9C-%EC%84%A0%EA%B5%90%EC%82%AC-%EC%B4%9D%EB%9E%8C-1884-2020.pdf"]],"st":"check"},{"id":"avison","ko":"에비슨","kn":"어비신","en":"Oliver R. Avison","life":"1860–1956","kr":"1893–1935","mko":"미국 북장로회 (캐나다 출신 의료)","men":"Presbyterian Church in the U.S.A. (Canadian, medical)","bko":["토론토대 의대 교수 자리를 내려놓고 1893년 내한해 제중원을 맡았다.","세브란스의 후원으로 세브란스병원(1904)과 의학교를 세웠고, 연희전문학교 교장도 18년간 겸했다. 오늘의 연세대학교로 이어진다."],"ben":["Left a professorship at the University of Toronto and arrived in 1893 to run Jejungwon hospital.","With Louis Severance’s gift he built Severance Hospital (1904) and its medical school, and led Chosen Christian College for 18 years, roots of today’s Yonsei University."],"g":[{"c":"hillcrest","t":"burial","nko":"1956년 미국 플로리다에서 별세, 아내와 함께 캐나다 스미스폴스에 안장.","nen":"Died in Florida in 1956; buried with his wife in Smiths Falls, Ontario."},{"c":"yhj","t":"family","plot":"F-46","nko":"아들 더글러스 에비슨 부부의 묘 (Find a Grave에는 에비슨 기념 표지로도 등록).","nen":"Grave of his son Douglas Avison and his wife (Find a Grave also lists a cenotaph for Avison here)."}],"s":[["Wikipedia","https://en.wikipedia.org/wiki/Oliver_R._Avison"],["Find a Grave (스미스폴스)","https://www.findagrave.com/memorial/51237887"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=4&mode=view"]],"st":"ok"},{"id":"grierson","ko":"그리어슨","kn":"구례선","en":"Robert Grierson","life":"1868–1965","kr":"1898–","mko":"캐나다 장로회 (의료)","men":"Presbyterian Church in Canada (medical)","bko":["매켄지의 죽음 뒤 캐나다 장로회가 처음 공식 파송한 선교사 세 명 가운데 한 사람(1898).","원산을 거쳐 함경도 성진 선교부를 맡아 의료와 전도를 함께했다."],"ben":["One of the first three missionaries the Presbyterian Church in Canada officially sent after McKenzie’s death (1898).","Worked from Wonsan and then led the Songjin station in North Hamgyong, combining medicine and evangelism."],"g":[{"c":"mtpleasant","t":"burial","plot":"Section 29, Lot 595"}],"s":[["Find a Grave","https://www.findagrave.com/memorial/260492546"],["Wikipedia","https://en.wikipedia.org/wiki/Robert_Grierson_(missionary)"]],"st":"ok"},{"id":"murray","ko":"플로렌스 머레이","kn":"모례리","en":"Florence Jessie Murray","life":"1894–1975","kr":"1921–1969","mko":"캐나다 장로회·연합교회 (의료)","men":"Canadian Presbyterian / United Church (medical)","bko":["1921년 함흥 제혜병원으로 파송되어 원장을 지냈다.","해방 후 이화여대 의학 교육과 세브란스병원을 이끌었고, 원주연합기독병원(연세대 미래캠퍼스의 뿌리)을 세웠다."],"ben":["Sent in 1921 to Jehye Hospital in Hamhung, which she later led.","After liberation she built medical training at Ewha, led Severance Hospital and founded Wonju Union Christian Hospital, a root of Yonsei’s Mirae Campus."],"g":[{"c":"fairview","t":"burial"}],"s":[["Find a Grave","https://www.findagrave.com/memorial/207250339"],["Wikipedia","https://en.wikipedia.org/wiki/Florence_J._Murray"]],"st":"ok"},{"id":"mckenzie","ko":"매켄지","kn":"매견시","en":"William John McKenzie","life":"1861–1895","kr":"1893–1895","mko":"독립 선교사 (캐나다 장로교 목사)","men":"Independent missionary (Canadian Presbyterian minister)","bko":["교단 후원 없이 독립 선교사로 1893년 내한해 황해도 소래에서 한국인처럼 살며 스스로 서는 교회를 일구었다.","1895년 소래에서 병중에 별세했고, 그의 죽음이 캐나다 장로회 한국 선교의 계기가 되었다."],"ben":["Came in 1893 as an independent missionary and lived as a Korean in Sorae, Hwanghae, nurturing a self-supporting church.","Died at Sorae in 1895 during an illness; his death moved the Presbyterian Church in Canada to begin its Korea mission."],"g":[{"c":"sorae","t":"burial","nko":"실제 묘가 있는 곳. 북한 지역이라 지금은 확인할 수 없다.","nen":"Actual burial place, in North Korea and not accessible today."},{"c":"mackay","t":"memorial","nko":"고향 케이프브레턴 가족묘지에 해외한인장로회 캐나다 동노회가 세운 묘비.","nen":"Memorial stone placed by a Korean-Canadian presbytery in his family cemetery on Cape Breton."}],"s":[["Wikipedia","https://en.wikipedia.org/wiki/William_McKenzie_(missionary)"],["Find a Grave","https://www.findagrave.com/memorial/270443000"],["시사한 목회칼럼 2026 (캐나다 동노회)","https://sisahan.com/478296"]],"st":"ok"},{"id":"gale","ko":"게일","kn":"기일","en":"James Scarth Gale","life":"1863–1937","kr":"1888–1927","mko":"미국 북장로회 (캐나다 출신)","men":"Presbyterian Church in the U.S.A. (Canadian-born)","bko":["토론토대 YMCA 후원으로 1888년 내한해 연동교회를 오래 섬겼다.","『한영자전』을 펴내고 『천로역정』을 번역했으며 성경 번역에 힘썼다. 은퇴 후 영국 바스에서 별세했다."],"ben":["Arrived in 1888 with University of Toronto YMCA support and long served Yeondong Church in Seoul.","Compiled a Korean–English dictionary, translated The Pilgrim’s Progress and worked on the Korean Bible. Died in Bath, England."],"g":[{"c":"lansdown","t":"burial"},{"c":"yhj","t":"family","plot":"D-08","nko":"첫 아내 해티 헤론 게일과 아들 비비안의 묘.","nen":"Graves of his first wife Hattie Heron Gale and his son Vivian."}],"s":[["Find a Grave","https://www.findagrave.com/memorial/142003191"],["Wikipedia","https://en.wikipedia.org/wiki/James_Scarth_Gale"],["양화진 공식 안내","https://yanghwajin.net/story/info.php?cat_no=1&idx=16&mode=view"]],"st":"ok"},{"id":"ross","ko":"존 로스","kn":"나요한","en":"John Ross","life":"1842–1915","kr":"만주 선교 1872–1910","kren":"Manchuria 1872–1910","mko":"스코틀랜드 연합장로교회 (만주)","men":"United Presbyterian Church of Scotland (Manchuria)","bko":["만주에서 일한 스코틀랜드 선교사. 이응찬·서상륜 등 한국인 동역자들과 함께 첫 한글 신약성경 『예수셩교젼셔』(1887)를 펴냈다.","이 성경이 국내로 들어와 초기 신앙 공동체의 씨앗이 되었다. 1915년 에든버러에서 별세."],"ben":["Scottish missionary in Manchuria who, with Korean co-workers, published the first Korean New Testament (1887).","These Scriptures were carried into Korea and seeded early believing communities. He died in Edinburgh in 1915."],"g":[{"c":"newington","t":"burial"}],"chk":{"ko":"한국에 와서 일한 선교사가 아니라 만주에서 한국인과 일했다. 사전 수록 범주(해외 한국인 대상 선교)에 드는지 확인이 필요하다.","en":"Worked with Koreans in Manchuria rather than in Korea; whether he falls within the dictionary’s scope needs checking."},"s":[["Wikipedia","https://en.wikipedia.org/wiki/John_Ross_(missionary)"]],"st":"check"},{"id":"kerr","ko":"에디스 커","kn":"","en":"Edith Amelia Kerr","life":"1893–1975","kr":"1921–1941","mko":"호주 빅토리아 장로회","men":"Presbyterian Church of Victoria","bko":["1921년부터 20년 동안 호주 장로회 선교사로 경남 통영에서 일했다.","통영 실업학교 교장을 지내고 집 없는 여성을 위한 농업학교를 세웠다."],"ben":["Served twenty years (1921–1941) with the Presbyterian Church of Victoria in Tongyeong.","Headed the Tongyeong industrial school and founded a farm school for homeless women."],"g":[{"c":"boxhill","t":"burial"}],"s":[["Wikipedia","https://en.wikipedia.org/wiki/Edith_Amelia_Kerr"],["Australian Dictionary of Biography","https://adb.anu.edu.au/biography/kerr-edith-amelia-10729"]],"st":"ok"},{"id":"mclaren","ko":"맥라렌","kn":"마라연","en":"Charles Inglis McLaren","life":"1882–1957","kr":"1911–","mko":"호주 빅토리아 장로회 (의료)","men":"Presbyterian Church of Victoria (medical)","bko":["진주 배돈병원 원장을 지낸 호주 의료선교사.","1922~1939년 세브란스에서 신경학과 정신의학을 가르쳐 한국 정신의학의 기틀을 놓았다."],"ben":["Australian medical missionary who led Paton Memorial Hospital in Jinju.","Taught neurology and psychiatry at Severance from 1922 to 1939, laying foundations for psychiatry in Korea."],"g":[{"c":"boxhill","t":"burial"}],"s":[["Wikipedia","https://en.wikipedia.org/wiki/Charles_McLaren_(psychiatrist)"]],"st":"ok"},{"id":"wb-scranton","ko":"윌리엄 스크랜턴","kn":"시란돈","en":"William Benton Scranton","life":"1856–1922","kr":"1885–1907","mko":"미국 북감리회 (의료)","men":"Methodist Episcopal Church (medical)","bko":["1885년 내한한 감리교 의료선교사로 시병원을 열고 상동교회를 세웠다.","1907년 선교사직을 사임한 뒤 의사로 일하다 1922년 일본 고베에서 별세했다."],"ben":["Methodist medical missionary who arrived in 1885, opened the Sibyeongwon clinic and founded Sangdong Church.","Resigned from the mission in 1907, kept practicing medicine and died in Kobe, Japan, in 1922."],"g":[{"c":"kobe","t":"burial","nko":"화장한 유해를 고베 외국인묘지에 안장.","nen":"His ashes were interred in the Kobe foreign cemetery."},{"c":"yhj","t":"memorial","plot":"B-44","nko":"어머니 메리 스크랜턴의 묘. Find a Grave에는 그의 기념 표지로도 등록되어 있다.","nen":"His mother Mary’s grave; Find a Grave also lists a cenotaph for him here."}],"s":[["Wikipedia","https://en.wikipedia.org/wiki/William_B._Scranton"],["Find a Grave (고베)","https://www.findagrave.com/memorial/154897651"]],"st":"ok"}];

    var n = list.length, onlyMem = list.every(function (x) { return x.g.t === 'memorial' || x.g.t === 'family' || x.g.t === 'former'; });
    var s = n > 1 ? 24 : 14;
    var icon = L.divIcon({ className: '', html: '<div class="pin' + (n > 1 ? ' multi' : '') + (onlyMem ? ' mem' : '') + '" data-c="' + id + '">' + (n > 1 ? n : '') + '</div>', iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
    var m = L.marker([c.lat, LON(c.lon)], { icon: icon, title: c.en, riseOnHover: true, zIndexOffset: n * 100 }).addTo(map);
    m.bindTooltip(function () { return '<b>' + esc(cemName(c)) + '</b><small>' + esc(cemPlace(c)) + ' · ' + esc(count(n)) + '</small>'; }, { className: 'rt', direction: 'top', offset: [0, -s / 2 - 2] });
    m.on('click', function () { go({ v: 'cem', c: id }); });
    m._baseZ = n * 100;
    markers[id] = m;
  });
  function pinsOf(cemIds) { return cemIds.filter(function (id) { return markers[id]; }).map(function (id) { return markers[id].getLatLng(); }); }
  var allPins = pinsOf(Object.keys(markers));
  function fitPins(pts, maxZoom) {
    if (!pts.length) return;
    if (pts.length === 1) { map.flyTo(pts[0], maxZoom || 7, { duration: 0.8 }); return; }
    map.flyToBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: maxZoom || 7, duration: 0.8 });
  }
  var arcLayer = L.layerGroup().addTo(map);
  function arc(a, b) {
    var pts = [], mx = (a.lat + b.lat) / 2, my = (a.lng + b.lng) / 2, dx = b.lng - a.lng, dy = b.lat - a.lat;
    var ox = dx * 0.2, oy = -dy * 0.2; if (ox < 0) { ox = -ox; oy = -oy; }
    var cx = Math.min(mx + ox, 78), cy = my + oy;
    for (var i = 0; i <= 40; i++) { var k = i / 40, u = 1 - k; pts.push([u * u * a.lat + 2 * u * k * cx + k * k * b.lat, u * u * a.lng + 2 * u * k * cy + k * k * b.lng]); }
    return pts;
  }
  function highlight(cemIds) {
    document.querySelectorAll('.pin.sel').forEach(function (el) { el.classList.remove('sel'); });
    Object.keys(markers).forEach(function (id) { markers[id].setZIndexOffset(markers[id]._baseZ || 0); });
    arcLayer.clearLayers();
    (cemIds || []).forEach(function (id) { var m = markers[id]; if (m && m.getElement()) { var el = m.getElement().querySelector('.pin'); if (el) el.classList.add('sel'); m.setZIndexOffset(1000); } });
    var pts = pinsOf(cemIds || []);
    for (var i = 1; i < pts.length; i++) L.polyline(arc(pts[0], pts[i]), { color: '#1d2943', weight: 1.6, dashArray: '4 6', opacity: 0.75 }).addTo(arcLayer);
  }

  /* ---------- UI chrome ---------- */
  var panel = document.getElementById('panel');
  var qEl = document.getElementById('q');
  function applyChrome() {
    document.documentElement.lang = lang;
    document.title = t('title') + (lang === 'ko' ? ' · 시범판' : ' · Pilot');
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    qEl.placeholder = t('search');
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === lang); });
    renderChips();
  }
  function renderChips() {
    var el = document.getElementById('chips');
    var cur = state.v === 'country' ? state.k : (state.v === 'home' ? 'ALL' : null);
    var html = '<button class="chip' + (cur === 'ALL' ? ' on' : '') + '" data-k="ALL">' + esc(t('all')) + ' <b>' + PEOPLE.length + '</b></button>';
    COUNTRY_ORDER.forEach(function (k) { if (k === 'KP' || !byCountry[k]) return; html += '<button class="chip' + (cur === k ? ' on' : '') + '" data-k="' + k + '">' + esc(cname(k)) + ' <b>' + byCountry[k].length + '</b></button>'; });
    el.innerHTML = html;
  }
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var k = b.getAttribute('data-k'); go(k === 'ALL' ? { v: 'home' } : { v: 'country', k: k });
  });
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); try { localStorage.setItem('mg-lang', lang); } catch (e) { } applyChrome(); render(false); adminLayer.setStyle(polyStyle); });
  });
  var qTimer;
  qEl.addEventListener('input', function () { clearTimeout(qTimer); qTimer = setTimeout(function () { var q = qEl.value.trim(); go(q ? { v: 'search', q: q } : { v: 'home' }); }, 120); });
  qEl.addEventListener('keydown', function (e) { if (e.key === 'Escape') { qEl.value = ''; go({ v: 'home' }); } });

  /* ---------- routing ---------- */
  var state = { v: 'home' }, stack = [];
  function enc(s) {
    if (s.v === 'person') return '#p=' + s.p; if (s.v === 'region') return '#r=' + s.r; if (s.v === 'cem') return '#c=' + s.c; if (s.v === 'country') return '#k=' + s.k; if (s.v === 'search') return '#q=' + encodeURIComponent(s.q); return '#';
  }
  function dec(h) {
    var m = /^#(p|r|c|k|q)=(.+)$/.exec(h || ''); if (!m) return { v: 'home' };
    var v = decodeURIComponent(m[2]);
    if (m[1] === 'p' && P[v]) return { v: 'person', p: v }; if (m[1] === 'r' && byRegion[v]) return { v: 'region', r: v };
    if (m[1] === 'c' && CEMS[v]) return { v: 'cem', c: v }; if (m[1] === 'k' && byCountry[v]) return { v: 'country', k: v }; if (m[1] === 'q') return { v: 'search', q: v };
    return { v: 'home' };
  }
  function go(s, fromBack) {
    if (!fromBack && state && JSON.stringify(state) !== JSON.stringify(s)) stack.push(state);
    state = s;
    try { history.replaceState(null, '', enc(s) === '#' ? location.pathname + location.search : enc(s)); } catch (e) { }
    render(true);
    if (window.innerWidth <= 960 && s.v !== 'home' && s.v !== 'search') panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function back() { var s = stack.pop() || { v: 'home' }; go(s, true); }

  /* ---------- views ---------- */
  function personRow(p, g) {
    var line = p.life + (p.kr ? ' · ' + krYears(p) : '');
    var tags = (g ? typeBadge(g.t) : '') + (p.related ? '<span class="badge b-related">' + esc(t('related')) + '</span>' : '') + (p.st === 'check' ? '<span class="badge b-check">' + esc(t('check')) + '</span>' : '');
    return '<div class="row" tabindex="0" data-p="' + p.id + '"><div class="avatar">' + esc(initial(p)) + '</div><div><div class="nm">' + esc(pname(p)) + (psub(p) ? '<small>' + esc(psub(p)) + '</small>' : '') + '</div>' +
      '<div class="ln">' + esc(line) + '</div><div class="one">' + esc(bio(p)[0]) + '</div>' + (tags ? '<div class="tags">' + tags + '</div>' : '') + '</div></div>';
  }
  function cemGroup(cid, people) {
    var c = CEMS[cid];
    var rows = people.map(function (x) { return personRow(x.p, x.g); }).join('');
    return '<div class="group"><div class="ghead" data-c="' + cid + '"><h3>' + esc(cemName(c)) + '</h3><span>' + esc(cemPlace(c)) + '</span></div>' + rows + '</div>';
  }
  function crumbs(parts) {
    return '<div class="crumbs">' + parts.map(function (x, i) { return (i ? '<span>›</span>' : '') + (x.go ? '<a data-go=\'' + esc(JSON.stringify(x.go)) + '\'>' + esc(x.t) + '</a>' : '<span>' + esc(x.t) + '</span>'); }).join('') + '</div>';
  }
  function graveCount() { var n = 0; PEOPLE.forEach(function (p) { n += p.g.length; }); return n; }
  function usStates() { return Object.keys(byRegion).filter(function (r) { return r.indexOf('US-') === 0; }).length; }
  function regionsOf(k) { return Object.keys(byRegion).filter(function (r) { return ctry(r) === k; }).sort(function (a, b) { return regionCount(b) - regionCount(a) || rname(a).localeCompare(rname(b)); }); }

  var VERIFY = {
    ko: [
      ['rosetta-hall', '동명이인', '로제타 홀: Find a Grave에 같은 이름, 같은 1865–1951년의 다른 사람이 있었다. 생일과 사망일로 구별했다.'],
      ['hardie', '본인 묘와 가족 묘', '하디·게일·에비슨: 양화진에 있는 것은 본인이 아니라 가족 묘나 기념 표지다. 실제 묘는 미시간, 영국 바스, 캐나다 온타리오에 있다.'],
      ['appenzeller', '시신 없는 추모비', '아펜젤러: 1902년 순직 뒤 시신을 찾지 못했다. 양화진과 펜실베이니아 두 곳 모두 추모비다.'],
      ['moffett', '이장', '마펫·언더우드: 미국에 묻혔다가 한국으로 이장되었다. 옛 묘와 지금 묘를 나눠 기록했다.'],
      ['kendrick', '자료끼리 불일치', '켄드릭 묘비의 사망일, 허스트의 생일, 아펜젤러의 양화진 구역 번호가 자료마다 다르다.'],
      ['mckenzie', '갈 수 없는 묘', '매켄지: 실제 묘는 황해도 소래(북한)에 있고, 캐나다 고향에는 기념 묘비가 있다.']
    ],
    en: [
      ['rosetta-hall', 'Namesakes', 'Rosetta Hall: Find a Grave lists another woman of the same name with the same birth and death years; told apart by exact dates.'],
      ['hardie', 'Own grave vs family grave', 'Hardie, Gale, Avison: what stands at Yanghwajin is a family grave or memorial; their own graves are in Michigan, Bath and Ontario.'],
      ['appenzeller', 'Memorial without remains', 'Appenzeller: his body was never recovered in 1902; both Yanghwajin and Pennsylvania hold memorials.'],
      ['moffett', 'Reinterment', 'Moffett, Underwood: first buried in the U.S., later moved to Korea; former and current graves are recorded separately.'],
      ['kendrick', 'Conflicting records', 'Kendrick’s death date on her headstone, Hirst’s birthday and Appenzeller’s plot number differ between sources.'],
      ['mckenzie', 'Unreachable grave', 'McKenzie: his actual grave is at Sorae in North Korea; his Canadian hometown has a memorial stone.']
    ]
  };

  function viewHome() {
    var html = '<div class="eyebrow">' + esc(t('overviewEyebrow')) + '</div><h2 class="ptitle">' + esc(t('overviewTitle')) + '</h2><p class="lead">' + esc(t('overviewLead')) + '</p>';
    var nCountries = COUNTRY_ORDER.filter(function (k) { return byCountry[k]; }).length;
    html += '<div class="stats"><div class="stat"><b>' + PEOPLE.length + '</b><span>' + esc(t('statPeople')) + '</span></div><div class="stat"><b>' + graveCount() + '</b><span>' + esc(t('statGraves')) + '</span></div><div class="stat"><b>' + nCountries + '</b><span>' + esc(t('statCountries')) + '</span></div><div class="stat"><b>' + usStates() + '</b><span>' + esc(t('statStates')) + '</span></div></div>';
    html += '<div class="section-t">' + esc(t('byRegion')) + '</div>';
    COUNTRY_ORDER.forEach(function (k) {
      if (!byCountry[k]) return;
      html += '<div class="rgroup"><h4 data-k="' + k + '">' + esc(cname(k)) + '<span>' + esc(count(byCountry[k].length)) + '</span></h4><div class="rlist">';
      regionsOf(k).forEach(function (r) { html += '<div class="rrow" data-r="' + r + '"><span>' + esc(rname(r)) + '</span><em>' + regionCount(r) + '</em></div>'; });
      html += '</div></div>';
    });
    html += '<div class="section-t">' + esc(t('verify')) + '</div><ul class="vlist">';
    VERIFY[lang].forEach(function (v) { html += '<li data-p="' + v[0] + '"><b>' + esc(v[1]) + '</b> · ' + esc(v[2]) + '</li>'; });
    html += '</ul><div class="foot">' + esc(t('pilotNote')) + '</div>';
    return html;
  }
  function viewCountry(k) {
    var regs = regionsOf(k);
    var html = crumbs([{ t: t('all'), go: { v: 'home' } }, { t: cname(k) }]);
    html += '<h2 class="ptitle">' + esc(cname(k)) + '</h2><div class="pmeta">' + esc(count(byCountry[k].length)) + ' · ' + regs.length + (lang === 'ko' ? '개 지역' : ' regions') + '</div>';
    regs.forEach(function (r) {
      html += '<div class="group"><div class="ghead" data-r="' + r + '"><h3>' + esc(rname(r)) + '</h3><span>' + esc(count(regionCount(r))) + '</span></div>';
      var seen = {};
      Object.keys(byCem).forEach(function (cid) { if (CEMS[cid].r !== r) return; byCem[cid].forEach(function (x) { if (seen[x.p.id]) return; seen[x.p.id] = 1; html += personRow(x.p, x.g); }); });
      html += '</div>';
    });
    return html;
  }
  function viewRegion(r) {
    var k = ctry(r);
    var html = crumbs([{ t: t('all'), go: { v: 'home' } }, { t: cname(k), go: byCountry[k] ? { v: 'country', k: k } : null }, { t: rname(r) }]);
    html += '<h2 class="ptitle">' + esc(rname(r)) + '</h2><div class="pmeta">' + esc(lang === 'ko' ? regionCount(r) + t('restHere') : count(regionCount(r)) + ' ' + t('restHere')) + '</div>';
    var cids = Object.keys(byCem).filter(function (cid) { return CEMS[cid].r === r; });
    if (!cids.length) return html + '<div class="empty">' + esc(t('emptyRegion')) + '</div>';
    cids.forEach(function (cid) { html += cemGroup(cid, byCem[cid]); });
    return html;
  }
  function viewCem(cid) {
    var c = CEMS[cid], r = c.r, k = ctry(r);
    var html = crumbs([{ t: t('all'), go: { v: 'home' } }, { t: cname(k), go: byCountry[k] ? { v: 'country', k: k } : null }, { t: rname(r), go: byRegion[r] ? { v: 'region', r: r } : null }]);
    html += '<div class="eyebrow">' + esc(cemPlace(c)) + '</div><h2 class="ptitle">' + esc(cemName(c)) + '</h2><div class="pmeta">' + esc(cemAlt(c)) + '</div>';
    html += '<div class="section-t">' + esc(t('inThis')) + ' · ' + esc(count((byCem[cid] || []).length)) + '</div>';
    (byCem[cid] || []).forEach(function (x) { html += personRow(x.p, x.g); });
    if (c.approx) html += '<div class="note">' + (lang === 'ko' ? '지도 위치는 인근 기준 대략 위치입니다.' : 'Map position is approximate.') + '</div>';
    return html;
  }
  function viewPerson(id) {
    var p = P[id];
    var html = '<button class="back" data-back>' + esc(t('back')) + '</button>';
    var eyebrow = lang === 'ko' ? (p.kn && p.kn !== p.ko ? '한국 이름 ' + p.kn : '') : (p.kn && p.kn !== p.ko ? 'Korean name ' + p.kn : '');
    html += '<div class="hero">' + (eyebrow ? '<div class="kn">' + esc(eyebrow) + '</div>' : '') + '<h2>' + esc(pname(p)) + '</h2><div class="en">' + esc(lang === 'ko' ? p.en : p.ko) + '</div><div class="tags">' + statusBadges(p) + '</div>';
    html += '<dl class="facts"><dt>' + esc(t('life')) + '</dt><dd>' + esc(p.life) + '</dd>' + (p.kr ? '<dt>' + esc(t('inKorea')) + '</dt><dd>' + esc(krYears(p)) + '</dd>' : '') + '<dt>' + esc(t('mission')) + '</dt><dd>' + esc(lang === 'ko' ? p.mko : p.men) + '</dd></dl></div>';
    html += '<div class="section-t">' + esc(t('did')) + '</div><ul class="did">' + bio(p).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>';
    html += '<div class="section-t">' + esc(t('rest')) + '</div>';
    p.g.forEach(function (g) {
      var c = CEMS[g.c];
      html += '<div class="gcard"><div class="top2"><div class="cn">' + esc(cemName(c)) + '<small>' + esc(cemAlt(c)) + '</small></div>' + typeBadge(g.t) + '</div>';
      html += '<div class="pl">' + esc(cemPlace(c)) + ' · ' + esc(rname(c.r) === cname(ctry(c.r)) ? cname(ctry(c.r)) : cname(ctry(c.r))) + (g.plot ? ' · ' + esc(t('plot')) + ' ' + esc(g.plot) : '') + '</div>';
      var nt = lang === 'ko' ? g.nko : g.nen; if (nt) html += '<div class="nt">' + esc(nt) + '</div>';
      html += '<div class="act">' + (c.nopin ? '<span class="badge b-former">' + esc(t('nopin')) + '</span>' : '<button class="btn" data-fly="' + g.c + '">' + esc(t('showOnMap')) + '</button>') + '</div></div>';
    });
    if (p.chk) html += '<div class="note' + (p.related && p.st !== 'check' ? ' blue' : '') + '"><b>' + esc(p.related && p.st !== 'check' ? t('relatedT') : t('checkT')) + '</b>' + esc(lang === 'ko' ? p.chk.ko : p.chk.en) + '</div>';
    html += '<div class="section-t">' + esc(t('sources')) + '</div><div class="src">' + p.s.map(function (s) { var host = ''; try { host = new URL(s[1]).hostname.replace(/^www\./, ''); } catch (e) { } return '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '<span>' + esc(host) + ' ↗</span></a>'; }).join('') + '</div>';
    html += '<div class="foot">' + esc(t('pilotNote')) + '</div>';
    return html;
  }
  function viewSearch(q) {
    var s = q.toLowerCase().replace(/\s+/g, '');
    var res = PEOPLE.filter(function (p) { return [p.ko, p.kn, p.en, p.mko, p.men].join(' ').toLowerCase().replace(/\s+/g, '').indexOf(s) >= 0; });
    var html = '<div class="eyebrow">' + esc(t('searchT')) + '</div><h2 class="ptitle">“' + esc(q) + '”</h2><div class="pmeta">' + esc(count(res.length)) + '</div>';
    if (!res.length) return html + '<div class="empty">' + esc(t('noResults')) + '</div>';
    res.forEach(function (p) { html += personRow(p, p.g[0]); });
    return html;
  }

  function render(moveMap) {
    var s = state, html = '';
    selRegion = null;
    if (s.v === 'home') { html = viewHome(); if (moveMap) { highlight([]); fitPins(allPins, 3); } }
    else if (s.v === 'country') { html = viewCountry(s.k); if (moveMap) { highlight([]); var ids = Object.keys(byCem).filter(function (cid) { return ctry(CEMS[cid].r) === s.k; }); fitPins(pinsOf(ids), s.k === 'KR' ? 7 : 5); } }
    else if (s.v === 'region') { selRegion = s.r; html = viewRegion(s.r); if (moveMap) { var cids = Object.keys(byCem).filter(function (cid) { return CEMS[cid].r === s.r; }); highlight(cids); if (regionBounds[s.r]) map.flyToBounds(regionBounds[s.r], { padding: [50, 50], maxZoom: 7, duration: 0.8 }); else fitPins(pinsOf(cids), 9); } }
    else if (s.v === 'cem') { selRegion = CEMS[s.c].r; html = viewCem(s.c); if (moveMap) { highlight([s.c]); fitPins(pinsOf([s.c]), 9); } }
    else if (s.v === 'person') { html = viewPerson(s.p); if (moveMap) { var gids = P[s.p].g.map(function (g) { return g.c; }); highlight(gids); fitPins(pinsOf(gids), 7); } }
    else if (s.v === 'search') { html = viewSearch(s.q); if (moveMap) highlight([]); }
    panel.innerHTML = html;
    panel.scrollTop = 0;
    adminLayer.setStyle(polyStyle);
    renderChips();
  }

  panel.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('[data-back]'))) return back();
    if ((el = e.target.closest('[data-fly]'))) { var m = markers[el.getAttribute('data-fly')]; if (m) { map.flyTo(m.getLatLng(), 11, { duration: 0.9 }); setTimeout(function () { m.openTooltip(); }, 950); if (window.innerWidth <= 960) document.querySelector('.mapwrap').scrollIntoView({ behavior: 'smooth' }); } return; }
    if ((el = e.target.closest('[data-go]'))) { var g = JSON.parse(el.getAttribute('data-go')); return go(g); }
    if ((el = e.target.closest('[data-p]'))) return go({ v: 'person', p: el.getAttribute('data-p') });
    if ((el = e.target.closest('[data-r]'))) return go({ v: 'region', r: el.getAttribute('data-r') });
    if ((el = e.target.closest('[data-c]'))) return go({ v: 'cem', c: el.getAttribute('data-c') });
    if ((el = e.target.closest('[data-k]'))) return go({ v: 'country', k: el.getAttribute('data-k') });
  });
  panel.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var el = e.target.closest('[data-p]'); if (el) go({ v: 'person', p: el.getAttribute('data-p') }); } });

  applyChrome();
  map.fitBounds(L.latLngBounds(allPins), { padding: [40, 70] });
  state = dec(location.hash);
  render(state.v !== 'home');
  if (state.v === 'search') qEl.value = state.q;
})();

</script>
</body>
</html>
